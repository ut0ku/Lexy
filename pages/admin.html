<div class="admin-page">
    <h1>Панель администратора</h1>
    
    <div class="admin-section">
        <h2>Публичные колоды библиотеки</h2>
        <button class="btn" id="createPublicDeckBtn" style="margin-bottom: 20px;">+ Создать колоду</button>
        
        <div id="adminDecksList" class="decks-grid">
            <p style="color: var(--text-secondary);">Загрузка...</p>
        </div>
    </div>

    <!-- Modal for creating-editing public deck -->
    <div class="modal-overlay" id="publicDeckModal">
        <div class="modal-content">
            <h3 id="publicDeckModalTitle">Создать колоду</h3>
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="publicDeckName" placeholder="Название колоды">
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="publicDeckDescription" placeholder="Описание колоды" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Язык</label>
                <select id="publicDeckLang">
                    <option value="Английский">Английский</option>
                    <option value="Немецкий">Немецкий</option>
                    <option value="Французский">Французский</option>
                    <option value="Испанский">Испанский</option>
                    <option value="Итальянский">Итальянский</option>
                </select>
            </div>
            <div class="form-group">
                <label>Категории (выберите нужные)</label>
                <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 8px;">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="publicDeckCategoryNew" value="new">
                        Новые
                    </label>
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="publicDeckCategoryPopular" value="popular">
                        Популярные
                    </label>
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="publicDeckCategoryRecommended" value="recommended">
                        Рекомендуемые
                    </label>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" id="savePublicDeckBtn">Сохранить</button>
                <button class="btn btn-outline" id="cancelPublicDeckBtn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Modal for managing cards in public deck -->
    <div class="modal-overlay" id="publicDeckCardsModal">
        <div class="modal-content" style="max-width: 700px; max-height: 80vh; overflow-y: auto;">
            <h3 id="publicDeckCardsTitle">Управление карточками</h3>
            
            <div class="form-group" style="margin-top: 15px;">
                <label>Добавить карточку</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="newPublicCardFront" placeholder="Слово" style="flex: 1; min-width: 150px;">
                    <input type="text" id="newPublicCardBack" placeholder="Перевод" style="flex: 1; min-width: 150px;">
                    <button class="btn" id="addPublicCardBtn">+</button>
                </div>
            </div>
            
            <div id="publicCardsList" style="margin-top: 20px;">
                <p style="color: var(--text-secondary);">Загрузка...</p>
            </div>
            
            <button class="btn btn-outline" id="closePublicCardsModal" style="margin-top: 20px;">Закрыть</button>
        </div>
    </div>
</div>
