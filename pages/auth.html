<!-- Окно авторизации -->
<div class="auth-modal" id="authModal">
    <div class="auth-container">
        <button class="auth-close" onclick="closeAuthModal()">×</button>
        
        <!-- Вкладки Вход/Регистрация -->
        <div class="auth-tabs">
            <button class="auth-tab active" data-auth-tab="login" onclick="switchAuthTab('login')">Вход</button>
            <button class="auth-tab" data-auth-tab="register" onclick="switchAuthTab('register')">Регистрация</button>
        </div>
        
        <!-- Форма входа -->
        <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" placeholder="username" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Пароль</label>
                <input type="password" id="loginPassword" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn btn-full">Войти</button>
        </form>
        
        <!-- Форма регистрации -->
        <form class="auth-form hidden" id="registerFormModal" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="regNameModal">Имя</label>
                <input type="text" id="regNameModal" placeholder="Ваше имя" required>
            </div>
            <div class="form-group">
                <label for="regUsernameModal">Username</label>
                <input type="text" id="regUsernameModal" placeholder="username" required>
            </div>
            <div class="form-group">
                <label for="regPasswordModal">Пароль</label>
                <input type="password" id="regPasswordModal" placeholder="Придумайте пароль" required>
            </div>
            <button type="submit" class="btn btn-full">Создать аккаунт</button>
        </form>
    </div>
</div>

<!-- Кнопка входа в навбаре -->
<button class="auth-btn" id="authBtn" onclick="openAuthModal()">
    <span class="auth-btn-text">Вход</span>
</button>
